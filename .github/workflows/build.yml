name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --concurrent-scripts=4
        env:
          # In case a @fantasticfugue/* scope ever resolves through GitHub Packages.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: bun run build

      # Tests that drive a real fughetta-service core (checkout sync, CLI against a
      # core, the worker behind a stand-in gateway) skip themselves when no service
      # binary is available. This job does not build the C++ service; set
      # FUGHETTA_SERVICE to a built binary (or add a service build step) to run them.
      - name: Test
        run: bun run test
        timeout-minutes: 20
